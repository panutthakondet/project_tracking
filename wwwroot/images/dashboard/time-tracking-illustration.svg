<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-labelledby="title desc">
  <title id="title">Time tracking illustration</title>
  <desc id="desc">A modern time tracking dashboard illustration with a clock, calendar card, and work hour markers.</desc>
  <defs>
    <linearGradient id="card" x1="64" y1="40" x2="360" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset=".52" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="clock" x1="124" y1="72" x2="275" y2="226" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="accent" x1="245" y1="70" x2="355" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="screen" x1="92" y1="179" x2="330" y2="249" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f274b"/>
      <stop offset="1" stop-color="#142f59"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#020617" flood-opacity=".36"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <ellipse cx="210" cy="262" rx="150" ry="22" fill="#020617" opacity=".22" filter="url(#soft)"/>
  <g filter="url(#shadow)">
    <rect x="54" y="44" width="312" height="194" rx="34" fill="url(#card)" opacity=".98"/>
    <path d="M54 170c48 18 89 9 126-14 53-33 99-34 186 6v42c0 19-15 34-34 34H88c-19 0-34-15-34-34v-34Z" fill="#0f172a" opacity=".2"/>
    <circle cx="171" cy="137" r="66" fill="url(#clock)"/>
    <circle cx="171" cy="137" r="52" fill="#e0f2fe"/>
    <circle cx="171" cy="137" r="7" fill="#0f274b"/>
    <path d="M171 99v38l31 18" fill="none" stroke="#0f274b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M171 84v13M171 177v13M224 137h13M105 137h13" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity=".75"/>
    <rect x="246" y="83" width="78" height="88" rx="18" fill="url(#accent)"/>
    <rect x="263" y="105" width="42" height="6" rx="3" fill="#fff" opacity=".78"/>
    <rect x="263" y="125" width="42" height="6" rx="3" fill="#fff" opacity=".58"/>
    <rect x="263" y="145" width="30" height="6" rx="3" fill="#fff" opacity=".58"/>
    <rect x="97" y="204" width="226" height="58" rx="20" fill="url(#screen)"/>
    <rect x="121" y="224" width="50" height="12" rx="6" fill="#22d3ee"/>
    <rect x="186" y="224" width="88" height="12" rx="6" fill="#34d399"/>
    <circle cx="296" cy="230" r="8" fill="#fbbf24"/>
  </g>
  <circle cx="322" cy="52" r="18" fill="#34d399" opacity=".9"/>
  <circle cx="84" cy="80" r="12" fill="#60a5fa" opacity=".9"/>
  <circle cx="346" cy="218" r="10" fill="#f472b6" opacity=".85"/>
</svg>
