<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" role="img" aria-label="Task progress">
  <defs>
    <linearGradient id="tile" x1="10" y1="8" x2="62" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1765c8"/>
      <stop offset="1" stop-color="#0b316f"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#031226" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="64" height="64" rx="15" fill="url(#tile)" stroke="#3ba4ff" stroke-width="2"/>
  <rect x="7" y="7" width="58" height="58" rx="13" fill="none" stroke="#9bdcff" stroke-opacity=".14"/>
  <g filter="url(#softShadow)" fill="#ffffff">
    <rect x="20" y="39" width="8" height="13" rx="3"/>
    <rect x="32" y="25" width="8" height="27" rx="3"/>
    <rect x="44" y="15" width="8" height="37" rx="3"/>
  </g>
</svg>
