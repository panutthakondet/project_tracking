name: projecttracking-security
services:
  zap:
    image: ${ZAP_IMAGE:-ghcr.io/zaproxy/zaproxy:stable}
    command: ["sh", "-c", "exec zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.key=$$ZAP_API_KEY -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true"]
    environment:
      ZAP_API_KEY: ${ZAP_API_KEY:?Set ZAP_API_KEY}
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2
    networks: [scanners]
  mobsf:
    image: ${MOBSF_IMAGE:-opensecurity/mobile-security-framework-mobsf:latest}
    environment:
      MOBSF_API_KEY: ${MOBSF_API_KEY:?Set MOBSF_API_KEY}
      MOBSF_API_ONLY: '1'
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import json, os, sys, urllib.request
          try:
              request = urllib.request.Request('http://127.0.0.1:8000/api/v1/scans', headers={'Authorization': os.environ['MOBSF_API_KEY']})
              with urllib.request.urlopen(request, timeout=10) as response:
                  payload = json.load(response)
                  valid = response.status == 200 and isinstance(payload, dict) and 'error' not in payload
              sys.exit(0 if valid else 1)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 15s
      start_period: 180s
      retries: 3
    volumes: ["mobsf-data:/home/mobsf/.MobSF"]
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2
    networks: [scanners]
  worker:
    build:
      context: ../..
      dockerfile: deploy/security/Dockerfile
    environment:
      SECURITY_APP_URL: ${SECURITY_APP_URL:?Set HTTPS application URL}
      SECURITY_WORKER_KEY: ${SECURITY_WORKER_KEY:?Set matching IIS worker key}
      SECURITY_ALLOWED_HOSTS: ${SECURITY_ALLOWED_HOSTS:-}
      SECURITY_ALLOW_PRIVATE_TARGETS: ${SECURITY_ALLOW_PRIVATE_TARGETS:-false}
      SECURITY_ALLOW_ACTIVE: ${SECURITY_ALLOW_ACTIVE:-false}
      SECURITY_AUTH_PROFILES_PATH: /profiles
      ZAP_URL: http://zap:8080/
      ZAP_API_KEY: ${ZAP_API_KEY}
      MOBSF_URL: http://mobsf:8000/
      MOBSF_API_KEY: ${MOBSF_API_KEY}
      MOBSF_IMAGE_VERSION: ${MOBSF_IMAGE:-opensecurity/mobile-security-framework-mobsf:latest}
    volumes: ["./profiles:/profiles:ro"]
    depends_on:
      zap:
        condition: service_healthy
      mobsf:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    networks: [scanners]
networks:
  scanners: {}
volumes:
  mobsf-data: {}
# No published ports. Do not expose scanner APIs to the Internet.
# Run exactly one worker per dedicated ZAP instance.
